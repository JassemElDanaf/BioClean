name: Deploy to host PC

# Runs on the self-hosted runner installed on the host PC (see DEPLOY.md
# "CI/CD setup"). Triggers on every merge to main. The whole point of this
# pipeline: production is never touched if staging fails.
#
# Flow (matches the plan's CI/CD design exactly):
#   backup production -> restore into disposable staging site -> build image
#   -> migrate + smoke-test staging -> only if that passes, migrate + restart
#   production.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: bioclean-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, bioclean-host]
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load environment
        run: |
          if [ ! -f docker/.env ]; then
            echo "::error::docker/.env is missing on this runner. Copy docker/.env.example -> docker/.env and fill in real secrets (see DEPLOY.md)."
            exit 1
          fi
          echo "Environment file present."

      - name: Backup production
        id: backup
        run: |
          set -euo pipefail
          cd docker
          STAMP=$(date +%Y%m%d-%H%M%S)
          echo "backup_stamp=$STAMP" >> "$GITHUB_OUTPUT"
          docker compose --env-file .env -p bioclean-prod exec -T backend \
            bench --site "${SITE_NAME:-bioclean.localhost}" backup --with-files
          echo "Backup complete. This is both the disaster-recovery point and the source for staging below."

      - name: Restore backup into disposable staging site
        run: |
          set -euo pipefail
          cd docker
          # Staging runs as its own compose project sharing the same MariaDB
          # container the production project uses, but as a completely
          # separate site + database - never the production one.
          docker compose --env-file .env -p bioclean-prod exec -T backend bash -c '
            set -e
            LATEST_DIR=$(ls -td sites/'"${SITE_NAME:-bioclean.localhost}"'/private/backups/*/ 2>/dev/null | head -1)
            if [ -z "$LATEST_DIR" ]; then
              LATEST_SQL=$(ls -t sites/'"${SITE_NAME:-bioclean.localhost}"'/private/backups/*.sql.gz 2>/dev/null | head -1)
            else
              LATEST_SQL=$(ls -t "$LATEST_DIR"*.sql.gz 2>/dev/null | head -1)
            fi
            echo "Using backup: $LATEST_SQL"
            bench new-site --db-root-password "${DB_PASSWORD:-123}" --admin-password admin \
              --install-app erpnext --force staging.local || true
            bench --site staging.local --force restore "$LATEST_SQL" \
              --db-root-password "${DB_PASSWORD:-123}" --admin-password admin
          '

      - name: Fetch frappe_docker at the pinned commit
        run: |
          set -euo pipefail
          PIN=$(cat docker/frappe_docker.pin)
          rm -rf /tmp/frappe_docker-build
          git clone https://github.com/frappe/frappe_docker.git /tmp/frappe_docker-build
          git -C /tmp/frappe_docker-build checkout "$PIN"

      - name: Build new image (erpnext + bioclean, per docker/apps.json)
        run: |
          set -euo pipefail
          cp docker/apps.json /tmp/frappe_docker-build/apps.json
          docker build \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH=version-16 \
            --secret=id=apps_json,src=/tmp/frappe_docker-build/apps.json \
            --tag="${CUSTOM_IMAGE:-bioclean}:${CUSTOM_TAG:-ci-${{ github.sha }}}" \
            --file=/tmp/frappe_docker-build/images/layered/Containerfile \
            /tmp/frappe_docker-build

      - name: Migrate + smoke-test staging (production untouched so far)
        run: |
          set -euo pipefail
          cd docker
          docker compose --env-file .env -p bioclean-prod exec -T backend \
            bench --site staging.local migrate
          # Smoke test: login page must actually load.
          STATUS=$(docker compose --env-file .env -p bioclean-prod exec -T backend \
            curl -s -o /dev/null -w "%{http_code}" -H "Host: staging.local" http://localhost:8000/login)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Staging smoke test failed (HTTP $STATUS). Production was never touched."
            exit 1
          fi
          echo "Staging smoke test passed."

      - name: Migrate production + restart with new image
        run: |
          set -euo pipefail
          cd docker
          docker compose --env-file .env -p bioclean-prod exec -T backend \
            bench --site "${SITE_NAME:-bioclean.localhost}" migrate
          CUSTOM_TAG="ci-${{ github.sha }}" docker compose --env-file .env -p bioclean-prod \
            -f compose.yaml -f overrides/compose.mariadb.yaml -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml -f overrides/compose.backup-cron.yaml up -d
          echo "Production migrated and restarted on ci-${{ github.sha }}."

      - name: Post-deploy health check
        run: |
          set -euo pipefail
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -H "Host: ${SITE_NAME:-bioclean.localhost}" http://localhost:8080/login)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Production health check failed after deploy (HTTP $STATUS). See DEPLOY.md 'Rollback model' for recovery steps."
            exit 1
          fi
          echo "Production is healthy on the new deploy."
