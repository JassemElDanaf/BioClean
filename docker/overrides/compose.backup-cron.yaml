# Vendored from frappe/frappe_docker, with BACKUP_CRONSTRING defaulted to once
# a day per plan decision (not the upstream default of every 6h) - see DEPLOY.md
# "Backups". Adjust BACKUP_CRONSTRING in your .env if you ever need to change it.
services:
  cron:
    image: mcuadros/ofelia:latest
    depends_on:
      - scheduler
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  scheduler:
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.datecron.schedule: "${BACKUP_CRONSTRING:-@daily}"
      ofelia.job-exec.datecron.command: "bench --site all backup --with-files"
      ofelia.job-exec.datecron.user: "frappe"
